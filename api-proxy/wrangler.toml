name = "goalhub-api-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[d1_databases]]
binding = "goalhub_db"
database_name = "goalhub-db"
database_id = "264d1943-724c-47dc-91f1-72cda487d203"

# Magic-link email is sent via the Resend REST API (see sendMagicLinkEmail
# in worker.js) using the RESEND_API_KEY secret — no binding needed for that,
# just `wrangler secret put RESEND_API_KEY`.
