<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoalHub — Live Football Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applied before first paint (inline, in <head>) so switching themes
    // doesn't flash the wrong one on load.
    (function () {
      try {
        if (localStorage.getItem("goalhub_theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (err) { /* localStorage unavailable — default dark stays */ }
    })();
  </script>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="brand">
      <span class="brand-badge">⚽</span>
      <span class="brand-name">Goal<span class="accent">Hub</span></span>
    </div>

    <nav class="header-nav">
      <a href="#liveNowSection" class="header-nav-link" onclick="jumpToLive()">Live Scores</a>
      <a href="#topLeaguesSection" class="header-nav-link">Leagues</a>
    </nav>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search teams… Arsenal, Real Madrid" oninput="searchTeams()">
    </div>

    <div class="header-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark/light theme">🌙</button>
      <div class="auth-area" id="authArea">
        <button class="auth-btn" id="authBtn" onclick="openAuthModal()">Login</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-section">
    <h1 class="hero-headline">Never Miss A <span class="accent">Goal</span></h1>
    <p class="hero-sub">Real live scores, full squads, and standings for 40+ leagues worldwide — updated as it happens.</p>
    <div class="hero-actions">
      <button class="hero-btn hero-btn-primary" onclick="document.getElementById('liveNowSection').scrollIntoView({behavior:'smooth'})">View Live Games</button>
      <button class="hero-btn hero-btn-secondary" onclick="openAuthModal()">Sign In</button>
    </div>
  </section>

  <!-- LIVE NOW -->
  <section class="live-now-section" id="liveNowSection">
    <div class="section-heading">
      <span class="live-now-title"><span class="live-dot"></span>Live Now</span>
    </div>
    <div class="live-now-grid" id="liveNowGrid"></div>
  </section>

  <!-- TOP LEAGUES -->
  <section class="top-leagues-section" id="topLeaguesSection">
    <div class="section-heading"><span>Top Leagues</span></div>
    <div class="top-leagues-scroll" id="topLeaguesScroll"></div>
  </section>

  <!-- LOGIN / ACCOUNT MODAL -->
  <div class="team-modal" id="authModal">
    <div class="team-modal-backdrop" onclick="closeAuthModal()"></div>
    <div class="team-modal-card glass auth-modal-card">
      <button class="team-modal-close" onclick="closeAuthModal()" aria-label="Close">&times;</button>
      <div id="authModalContent"></div>
    </div>
  </div>

  <div class="main-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar glass" id="sidebar">
      <h3>Competitions</h3>
      <div id="competitions"></div>
    </aside>

    <!-- CENTER -->
    <main class="content glass">
      <div class="date-bar">
        <button id="liveBtn" class="live-nav-btn" onclick="jumpToLive()" aria-label="Jump to live matches">
          <span class="live-dot"></span>LIVE
        </button>
        <div class="date-nav">
          <button id="prevDay" class="date-btn" aria-label="Previous day">‹</button>
          <span class="date-label">Today</span>
          <button id="nextDay" class="date-btn" aria-label="Next day">›</button>
        </div>
        <div class="calendar-nav-btn" id="calendarBtn" aria-label="Pick a date">
          <span class="calendar-icon">📅</span>
          <span class="calendar-day-num" id="calendarDayNum"></span>
          <input type="date" id="datePickerInput" class="date-picker-input" aria-label="Choose date" onchange="if(this.value) loadMatchesForDate(new Date(this.value + 'T00:00:00'))">
        </div>
      </div>
      <div class="view-toggle">
        <button id="viewMatchesBtn" class="view-toggle-btn active" onclick="setViewMode('matches')">All Matches</button>
        <button id="viewTeamsBtn" class="view-toggle-btn" onclick="setViewMode('teams')">All Teams</button>
        <button id="viewFavoritesBtn" class="view-toggle-btn" onclick="setViewMode('favorites')">★ Favorites</button>
      </div>
      <div id="matches"></div>
    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="rightbar glass">
      <h3>Today's Featured</h3>
      <div id="featured"></div>
    </aside>
  </div>

  <footer class="site-footer">Data from TheSportsDB. GoalHub 2026</footer>

  <!-- TEAM DETAIL MODAL -->
  <div class="team-modal" id="teamModal">
    <div class="team-modal-backdrop" onclick="closeTeamModal()"></div>
    <div class="team-modal-card glass">
      <button class="team-modal-close" onclick="closeTeamModal()" aria-label="Close">&times;</button>
      <div id="teamModalContent"></div>
    </div>
  </div>

  <!-- MATCH DETAIL MODAL -->
  <div class="team-modal" id="matchModal">
    <div class="team-modal-backdrop" onclick="closeMatchModal()"></div>
    <div class="team-modal-card glass match-modal-card">
      <button class="team-modal-close" onclick="closeMatchModal()" aria-label="Close">&times;</button>
      <div id="matchModalContent"></div>
    </div>
  </div>

  <script src="manual-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
